name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  release:
    name: Release CLI
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release):')
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          check-latest: true
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Extract version from commit message
        id: version
        run: |
          VERSION=$(git log -1 --pretty=%s | sed -nE 's/^chore\(release\): ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

      - name: Validate version format
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid version format '$VERSION'. Expected semver (x.y.z)"
            exit 1
          fi

      - name: Check published package versions
        id: published
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          needs_publish=false
          for entry in cli=create-better-tanstacked; do
            key=${entry%%=*}
            package=${entry#*=}
            if ! versions=$(npm view "$package" versions --json 2>/dev/null); then
              versions='[]'
            fi
            exists=$(jq -r --arg version "$VERSION" 'if type == "array" then index($version) != null else error("Expected an npm version list") end' <<< "$versions")
            echo "${key}_exists=$exists" >> "$GITHUB_OUTPUT"
            if [[ "$exists" == false ]]; then
              needs_publish=true
            else
              published_commit=$(npm view "$package@$VERSION" gitHead)
              if [[ "$published_commit" != "$GITHUB_SHA" ]]; then
                echo "::error::$package@$VERSION was not published from $GITHUB_SHA. Use a new release version."
                exit 1
              fi
            fi
          done
          echo "needs_publish=$needs_publish" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        if: steps.published.outputs.needs_publish == 'true'
        run: bun install --frozen-lockfile

      - name: Build CLI
        if: steps.published.outputs.needs_publish == 'true'
        run: cd apps/cli && bun run build
        env:
          BTS_TELEMETRY: 1
          CONVEX_INGEST_URL: ${{ secrets.CONVEX_INGEST_URL }}
          UMAMI_CLI_WEBSITE_ID: ${{ secrets.UMAMI_CLI_WEBSITE_ID }}

      - name: Remove workspace-only build dependencies from the published manifest
        if: steps.published.outputs.needs_publish == 'true'
        run: |
          cd apps/cli
          jq 'del(.devDependencies["@better-t-stack/template-generator"], .devDependencies["@better-t-stack/types"])' package.json > tmp.json && mv tmp.json package.json

      - name: Setup pnpm
        if: steps.published.outputs.needs_publish == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: latest

      # Gate the CLI publish on a consumer install and command smoke check.
      - name: Publish smoke test (npm, pnpm, bun)
        if: steps.published.outputs.needs_publish == 'true'
        run: bun run smoke:publish

      - name: Publish CLI to NPM
        if: steps.published.outputs.cli_exists == 'false'
        run: cd apps/cli && npm publish --access public
        env:
          BTS_TELEMETRY: 1
          CONVEX_INGEST_URL: ${{ secrets.CONVEX_INGEST_URL }}
          UMAMI_CLI_WEBSITE_ID: ${{ secrets.UMAMI_CLI_WEBSITE_ID }}

      - name: Create and push tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config --local user.email "amanvarshney.work@gmail.com"
          git config --local user.name "Aman Varshney"
          if ! git rev-parse "v$VERSION" >/dev/null 2>&1; then
            git tag -a "v$VERSION" -m "Release v$VERSION"
            git push --tags
          else
            if [[ "$(git rev-parse "v$VERSION^{commit}")" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag v$VERSION belongs to a different commit."
              exit 1
            fi
            echo "Tag v$VERSION already exists, skipping"
          fi

      - name: Create GitHub Release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            bunx changelogithub
          else
            echo "Release v$VERSION already exists, skipping"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "## Packages published for v$VERSION" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Published Packages" >> $GITHUB_STEP_SUMMARY
          echo "- [create-better-tanstacked@$VERSION](https://www.npmjs.com/package/create-better-tanstacked/v/$VERSION)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### GitHub Release" >> $GITHUB_STEP_SUMMARY
          echo "[v$VERSION](https://github.com/${{ github.repository }}/releases/tag/v$VERSION)" >> $GITHUB_STEP_SUMMARY
